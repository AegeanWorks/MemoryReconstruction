<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Memory Reconstruction - Action Roguelike Metroidvania">
  <title>Memory Reconstruction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"> <!-- hygiene: allow Google Fonts CDN -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <!-- hygiene: allow Google Fonts CDN -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"> <!-- hygiene: allow Google Fonts CDN -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #game-container { width: 100%; height: 100%; overflow: hidden; }
    body { background: #0a0a0f; font-family: 'Inter', sans-serif; color: #e8e8e8; }
    #game-container { position: relative; }
    #game-container > canvas { display: block; width: 100%; height: 100%; }
    .loading-screen {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1rem;
      background: linear-gradient(180deg, #0a0a0f 0%, #1a1a2e 100%);
      z-index: 100; transition: opacity 0.5s, visibility 0.5s;
    }
    .loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .loading-title { font-family: 'Cinzel', serif; font-size: 3rem; font-weight: 700; 
      background: linear-gradient(90deg, #ffd700, #ff8c00, #ffd700);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; animation: shimmer 2s infinite; }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    .loading-bar { width: 300px; height: 4px; background: #2a2a3e; border-radius: 2px; overflow: hidden; }
    .loading-progress { width: 0%; height: 100%; background: linear-gradient(90deg, #ffd700, #ff8c00); 
      transition: width 0.3s ease; border-radius: 2px; }
    .loading-text { font-size: 0.9rem; color: #888; font-weight: 300; }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="ui"></div>
    <div class="loading-screen" id="loading-screen">
      <div class="loading-title">MEMORY RECONSTRUCTION</div>
      <div class="loading-bar"><div class="loading-progress" id="loading-progress"></div></div>
      <div class="loading-text" id="loading-text">Initializing...</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
